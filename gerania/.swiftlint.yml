disabled_rules:
  - todo
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

excluded:
  - .build
  - build
  - DerivedData
  - Tools
  - tools
  - docs
  - Packages/GeraniaKit/.build

line_length:
  warning: 120
  error: 160
  ignores_comments: true

cyclomatic_complexity:
  warning: 50
  error: 60

function_body_length:
  warning: 120
  error: 160

file_length:
  warning: 300
  error: 400

identifier_name:
  min_length: 1
  max_length: 50

type_name:
  min_length: 2
  max_length: 50
